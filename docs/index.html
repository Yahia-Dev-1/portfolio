<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portofolio</title>
    <script type="module" crossorigin src="/portfolio/assets/index-CIHLakwU.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio/assets/index-EE4CVxal.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
    <script>
      // تسجيل ScrollTrigger plugin مع GSAP
      if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        gsap.registerPlugin(ScrollTrigger);
        console.log('✅ ScrollTrigger سُسجّلت على GSAP');
      }

      function setupAnimations() {
        const scrollRevealEls = document.querySelectorAll('.scroll-reveal');
        if (scrollRevealEls.length === 0) {
          // العناصر لم تحمّل بعد، جرّب مرة أخرى
          setTimeout(setupAnimations, 500);
          return;
        }

        console.log('✅ وجدت ' + scrollRevealEls.length + ' عنصر scroll-reveal');

        // تأكد من تسجيل ScrollTrigger
        if (typeof ScrollTrigger === 'undefined' || typeof gsap.ScrollTrigger === 'undefined') {
          console.error('❌ ScrollTrigger لم تُسجّل بشكل صحيح');
          return;
        }

        // Fade in on scroll
        scrollRevealEls.forEach((el, idx) => {
          gsap.fromTo(
            el,
            { opacity: 0, y: 50 },
            {
              opacity: 1,
              y: 0,
              duration: 0.8,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: el,
                start: 'top 80%',
                end: 'top 50%',
                scrub: false,
              },
            }
          );
        });

        // Slide left
        document.querySelectorAll('.scroll-reveal-left').forEach((el) => {
          gsap.fromTo(
            el,
            { opacity: 0, x: -60 },
            {
              opacity: 1,
              x: 0,
              duration: 0.8,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: el,
                start: 'top 80%',
                end: 'top 50%',
                scrub: false,
              },
            }
          );
        });

        // Slide right
        document.querySelectorAll('.scroll-reveal-right').forEach((el) => {
          gsap.fromTo(
            el,
            { opacity: 0, x: 60 },
            {
              opacity: 1,
              x: 0,
              duration: 0.8,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: el,
                start: 'top 80%',
                end: 'top 50%',
                scrub: false,
              },
            }
          );
        });

        // Scale
        document.querySelectorAll('.scroll-reveal-scale').forEach((el) => {
          gsap.fromTo(
            el,
            { opacity: 0, scale: 0.8 },
            {
              opacity: 1,
              scale: 1,
              duration: 0.8,
              ease: 'back.out',
              scrollTrigger: {
                trigger: el,
                start: 'top 80%',
                end: 'top 50%',
                scrub: false,
              },
            }
          );
        });

        console.log('🎨 جميع GSAP animations تم تعيينها بنجاح!');
      }

      // حاول تشغيل الـ animations عند التحميل والـ react updates
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(setupAnimations, 1500));
      } else {
        setTimeout(setupAnimations, 1500);
      }

      window.addEventListener('load', setupAnimations);
    </script>
  </body>
</html>
